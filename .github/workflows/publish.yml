name: Blog Sync

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '.github/workflows/publish.yml'
      - 'scripts/**'
  workflow_dispatch: {}

permissions:
  contents: write   # needed to commit the sync-state file back

concurrency:
  group: blog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run blog sync
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python scripts/blog_sync.py --vault . --base-url "$WP_BASE_URL" --user "$WP_USER" --password "$WP_APP_PASSWORD"

      - name: Commit sync state
        run: |
          git config user.name "blog-sync-bot"
          git config user.email "blog-sync-bot@users.noreply.github.com"
          if ! git diff --quiet -- .blog-sync-state.json; then
            git add .blog-sync-state.json
            git commit -m "blog sync state: update"
            git pull --rebase --autostash origin main
            git push origin main
          fi
